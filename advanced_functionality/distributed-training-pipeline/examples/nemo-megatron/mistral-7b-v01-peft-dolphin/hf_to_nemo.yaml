resources:
  instance_count: 1
  instance_type: ml.p4d.24xlarge
  volume_size: 400
pre_script: 
  - set -e
  - SCRIPT_DIR=/opt/NeMo/scripts/checkpoint_converters
  - cd $SCRIPT_DIR
  - mkdir -p $HOME/logs
  - OUTPUT_LOG=$HOME/logs/hf_to_nemo.log
  - TMP_MODEL_PATH=/tmp/model
  - '[ -n "$S3_MODEL_PATH" ] && aws s3 cp --recursive "$S3_MODEL_PATH" "$TMP_MODEL_PATH" || cp -r "$SM_CHANNEL_MODEL" "$TMP_MODEL_PATH"'
  - OUTPUT_DIR="${SM_CHANNEL_CHECKPOINTS:-/opt/ml/checkpoints}"
train:
  env:
    - name: HOME
      value: $SM_OUTPUT_DATA_DIR
  command:
    - python3
  args:
    - convert_mistral_7b_hf_to_nemo.py
    - --input_name_or_path=$TMP_MODEL_PATH/ 
    - --output_path=$OUTPUT_DIR/ckpt.nemo
    - '2>&1 | tee $OUTPUT_LOG'
