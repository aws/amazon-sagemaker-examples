name: XGBoost inference regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  csv-output:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=1.26,<3' 'black==26.10.1'
      - name: Test offline CSV serialization
        run: python -m unittest discover -s '      training/sm-regression_xgboost/tests' -v
      - name: Check formatting
        run: python -m black -l 100 --check '      training/sm-regression_xgboost/inference.py' '      training/sm-regression_xgboost/tests'
