resources:
  instance_count: 1
  instance_type: ml.p4d.24xlarge
  volume_size: 500
pre_script: 
  - set -e
  - SCRIPT_DIR=/opt/NeMo/scripts/checkpoint_converters
  - cd $SCRIPT_DIR
  - mkdir -p $HOME/logs
  - OUTPUT_LOG=$HOME/logs/nemo_to_hf.log
  - HF_MODEL_PATH=$SM_MODEL_DIR
  - MODEL_PATH="${SM_CHANNEL_MODEL:-/tmp/model}"
  - '[ -n "$S3_MODEL_PATH" ] && aws s3 cp --recursive "$S3_MODEL_PATH" "$MODEL_PATH" || : '
  - CHECKPOINT_DIR="${SM_CHANNEL_CHECKPOINTS:-/opt/ml/checkpoints}"
  - PATH_TO_MERGED_MODEL=$CHECKPOINT_DIR/merged_model.nemo
  - echo "PATH_TO_MERGED_MODEL=$PATH_TO_MERGED_MODEL"
train:
  env:
    - name: HOME
      value: $SM_OUTPUT_DATA_DIR
  command:
    - python3
  args:
    - convert_mistral_7b_nemo_to_hf.py
    - --input_name_or_path=$PATH_TO_MERGED_MODEL
    - --output_path=$HF_MODEL_PATH
    - --hf_model_name=$MODEL_PATH
    - '2>&1 | tee $OUTPUT_LOG'
