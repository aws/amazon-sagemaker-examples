resources:
  instance_count: 1
  instance_type: ml.p4d.24xlarge
  volume_size: 500
pre_script: 
  - set -e
  - pip install transformers==4.43.4
  - SCRIPT_DIR=/opt/NeMo/scripts/nlp_language_modeling/merge_lora_weights
  - cd $SCRIPT_DIR
  - mkdir -p $HOME/logs
  - OUTPUT_LOG=$HOME/logs/merge_peft.log
  - CHECKPOINT_DIR="${SM_CHANNEL_CHECKPOINTS:-/opt/ml/checkpoints}"
  - PATH_TO_BASE_MODEL=$CHECKPOINT_DIR/ckpt.nemo
  - echo "PATH_TO_BASE_MODEL=$PATH_TO_BASE_MODEL"
  - PATH_TO_PEFT_MODEL=$CHECKPOINT_DIR/nemo_experiments/checkpoints/${EXP_NAME}_fixed.nemo
  - echo "PATH_TO_PEFT_MODEL=$PATH_TO_PEFT_MODEL"
  - PATH_TO_MERGED_MODEL=$CHECKPOINT_DIR/merged_model.nemo
  - echo "PATH_TO_MERGED_MODEL=$PATH_TO_MERGED_MODEL"
train:
  env:
    - name: HOME
      value: $SM_OUTPUT_DATA_DIR
    - name: EXP_NAME
      value: peft
  command:
    - python
  args:
    - merge.py
    - trainer.accelerator=gpu
    - gpt_model_file=$PATH_TO_BASE_MODEL
    - lora_model_path=$PATH_TO_PEFT_MODEL
    - merged_model_path=$PATH_TO_MERGED_MODEL
    - '2>&1 | tee $OUTPUT_LOG'
