resources:
  instance_count: 1
  instance_type: ml.p4d.24xlarge
  volume_size: 400
pre_script: 
  - set -e
  - export DISTRIBUTED_ARGS="--nproc_per_node $PET_NPROC_PER_NODE --nnodes $PET_NNODES --node_rank $PET_NODE_RANK --master_addr $PET_MASTER_ADDR --master_port $PET_MASTER_PORT"
  - echo "DISTRIBUTED_ARGS=$DISTRIBUTED_ARGS"
  - mkdir -p $HOME/logs
  - export OUTPUT_LOG=$HOME/logs/peft.log
  - CHECKPOINT_DIR="${SM_CHANNEL_CHECKPOINTS:-/opt/ml/checkpoints}"
  - EXP_DIR="$SM_OUTPUT_INTERMEDIATE_DIR/nemo_experiments"
  - MODEL="$CHECKPOINT_DIR/ckpt.nemo" 
  - '[ -n "$S3_DATA_PATH" ] && aws s3 cp --recursive "$S3_DATA_PATH/" /tmp/ || cp -r "$SM_CHANNEL_DATA"/* /tmp/'
  - echo "Verifying files in /tmp/:" && ls -al /tmp/
  - DATASET="dolphin"
  - (ls -al /tmp/${DATASET}_train.jsonl && ls -al /tmp/${DATASET}_valid.jsonl) || ( echo "Missing Data" && exit 1)
  - TRAIN_DS="[/tmp/${DATASET}_train.jsonl]"
  - VALID_DS="[/tmp/${DATASET}_valid.jsonl]"
  - SCHEME="lora"
  - CONCAT_SAMPLING_PROBS="[1.0]"
  - TP_SIZE=8
  - PP_SIZE=1
  - MAX_STEPS=1000
  - export HYDRA_FULL_ERROR=1
  - export PEFT_ARGS="
    trainer.devices=$PET_NPROC_PER_NODE
    trainer.num_nodes=$PET_NNODES 
    trainer.precision=bf16
    trainer.val_check_interval=100
    +trainer.limit_val_batches=100
    trainer.max_steps=$MAX_STEPS
    model.megatron_amp_O2=True
    ++model.mcore_gpt=True
    model.tensor_model_parallel_size=${TP_SIZE}
    model.pipeline_model_parallel_size=${PP_SIZE}
    model.micro_batch_size=8
    model.global_batch_size=96
    model.optim.lr=5e-4
    model.restore_from_path=${MODEL}
    model.data.train_ds.num_workers=1
    model.data.train_ds.memmap_workers=1
    model.data.train_ds.pin_memory=false
    model.data.validation_ds.num_workers=1
    model.data.validation_ds.pin_memory=false
    model.data.validation_ds.shuffle=true
    model.data.validation_ds.memmap_workers=1
    model.data.train_ds.file_names=${TRAIN_DS}
    model.data.train_ds.concat_sampling_probabilities=[1.0]
    model.data.validation_ds.file_names=${VALID_DS}
    model.peft.peft_scheme=${SCHEME}
    model.peft.lora_tuning.target_modules=[attention_qkv]
    exp_manager.name=$EXP_NAME 
    exp_manager.create_wandb_logger=False
    exp_manager.checkpoint_callback_params.mode=min
    exp_manager.explicit_log_dir=$EXP_DIR
    exp_manager.resume_if_exists=True
    exp_manager.resume_ignore_no_checkpoint=True
    exp_manager.create_checkpoint_callback=True
    exp_manager.checkpoint_callback_params.monitor=validation_loss
    ++exp_manager.checkpoint_callback_params.save_best_model=True
    exp_manager.checkpoint_callback_params.save_nemo_on_train_end=True
    exp_manager.early_stopping_callback_params.monitor=val_loss
    exp_manager.early_stopping_callback_params.patience=3
    exp_manager.early_stopping_callback_params.min_delta=0.001
    model.save_nemo_on_validation_end=False"
  - SCRIPT_DIR=/opt/NeMo/examples/nlp/language_modeling/tuning
  - export NCCL_SOCKET_IFNAME=$SM_NETWORK_INTERFACE_NAME
  - export NCCL_SOCKET_FAMILY=AF_INET
post_script:
  - echo "Copying $EXP_DIR to $CHECKPOINT_DIR"
  - cp -r ${EXP_DIR} $CHECKPOINT_DIR/
train:
  distribution: "torch"
  env:
    - name: HOME
      value: $SM_OUTPUT_DATA_DIR
    - name: EXP_NAME
      value: peft
    - name: NCCL_DEBUG
      value: "WARN"
    - name: FI_EFA_USE_DEVICE_RDMA
      value: "1"
    - name: FI_PROVIDER
      value: "efa"
    - name: FI_EFA_FORK_SAFE
      value: "1"
    - name: "RDMAV_FORK_SAFE"
      value: "1"
  command:
    -  "torchrun"
  args: 
    - $DISTRIBUTED_ARGS
    - $SCRIPT_DIR/megatron_gpt_finetuning.py
    - $PEFT_ARGS
    - '2>&1 | tee $OUTPUT_LOG' 
