resources:
  instance_count: 1
  instance_type: ml.p4d.24xlarge
  volume_size: 400
pre_script: 
  - set -e
  - export DISTRIBUTED_ARGS="--nproc_per_node $PET_NPROC_PER_NODE --nnodes $PET_NNODES --node_rank $PET_NODE_RANK --master_addr $PET_MASTER_ADDR --master_port $PET_MASTER_PORT"
  - echo "DISTRIBUTED_ARGS=$DISTRIBUTED_ARGS"
  - mkdir -p $HOME/logs
  - export OUTPUT_LOG=$HOME/logs/peft_eval.log
  - CHECKPOINT_DIR="${SM_CHANNEL_CHECKPOINTS:-/opt/ml/checkpoints}"
  - MODEL="$CHECKPOINT_DIR/ckpt.nemo"
  - '[ -n "$S3_DATA_PATH" ] && aws s3 cp --recursive "$S3_DATA_PATH/" /tmp/ || cp -r "$SM_CHANNEL_DATA"/* /tmp/'
  - echo "Verifying files in /tmp/:" && ls -al /tmp/
  - DATASET="dolphin"
  - ls -al /tmp/${DATASET}_test.jsonl || ( echo "Missing Data" && exit 1)
  - TEST_DS="[/tmp/${DATASET}_test.jsonl]"
  - TEST_NAMES="[${DATASET}]"
  - SCHEME="lora"
  - CONCAT_SAMPLING_PROBS="[1.0]"
  - TP_SIZE=8
  - PP_SIZE=1
  - TOKENS_TO_GENERATE=700
  - OUTPUT_PREFIX=$HOME/eval_results
  - export PATH_TO_TRAINED_MODEL=$CHECKPOINT_DIR/nemo_experiments/checkpoints/${EXP_NAME}.nemo
  - export HYDRA_FULL_ERROR=1
  - export PEFT_ARGS="
    trainer.precision=bf16
    trainer.devices=$PET_NPROC_PER_NODE
    trainer.num_nodes=$PET_NNODES 
    model.restore_from_path=${MODEL} 
    model.micro_batch_size=32
    model.global_batch_size=32
    ++model.mcore_gpt=True
    model.peft.restore_from_path=$CHECKPOINT_DIR/nemo_experiments/checkpoints/${EXP_NAME}_fixed.nemo
    trainer.devices=${PET_NPROC_PER_NODE} 
    +trainer.limit_test_batches=100
    model.data.test_ds.file_names=${TEST_DS} 
    model.data.test_ds.names=${TEST_NAMES}
    model.data.test_ds.tokens_to_generate=${TOKENS_TO_GENERATE} 
    model.data.test_ds.num_workers=8
    model.data.test_ds.drop_last=True
    model.data.test_ds.shuffle=True
    model.tensor_model_parallel_size=${TP_SIZE} 
    model.megatron_amp_O2=True 
    model.pipeline_model_parallel_size=${PP_SIZE}
    inference.top_k=50 
    model.data.test_ds.output_file_path_prefix=${OUTPUT_PREFIX} 
    model.answer_only_loss=True 
    model.data.test_ds.write_predictions_to_file=True"
  - SCRIPT_DIR=/opt/NeMo/examples/nlp/language_modeling/tuning
  - echo "PATH_TO_TRAINED_MODEL=$PATH_TO_TRAINED_MODEL"
  - base_dir="$(dirname "$0")"
  - python3 $base_dir/fix_peft_ckpt.py
train:
  distribution: "torch"
  env:
    - name: HOME
      value: $SM_OUTPUT_DATA_DIR
    - name: EXP_NAME
      value: peft
  command:
    -  "torchrun"
  args: 
    - $DISTRIBUTED_ARGS
    - $SCRIPT_DIR/megatron_gpt_generate.py
    - $PEFT_ARGS
    - '2>&1 | tee $OUTPUT_LOG' 
