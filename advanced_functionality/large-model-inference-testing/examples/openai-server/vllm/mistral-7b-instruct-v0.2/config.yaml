sagemaker:
  model:
    name: "mistral-7b-instruct-v0-2-openai-server-vllm"
    container: "containers/openai-server-vllm"
    env: 
      HF_HOME: "/tmp"
      MODEL_ID: "mistralai/Mistral-7B-Instruct-v0.2"
      OMP_NUM_THREADS: "16"
      VLLM_CONFIG: "/opt/ml/model/vllm_config.yaml"
  endpoint:
    name: "mistral-7b-instruct-v0-2-openai-server-vllm"
    instance_type: "ml.g6.48xlarge"
    initial_instance_count: 1
    variant_name: "test"
    model_data_download_timeout_secs: 1200
    container_startup_health_check_timeout_secs: 1200
    inference_ami_version: "al2023-ami-sagemaker-inference-gpu-4-1"
test:
  module_name: "prompt_generator"
  module_dir: "modules/inst-semeval2017"
  prompt_generator: "PromptGenerator"
  template: { "model": "mistralai/Mistral-7B-Instruct-v0.2", "max_tokens": 2048, "top_k": 50, "messages": [ { "role": "user", "content": [ {"type" : "text", "text": ""} ] } ] }
  template_keys: ["messages.[0].content.[0].text"]
  warmup_iters: 1
  n_concurrent: 4
  max_iters: 10
  output_dir: "output"
  locust_users: 32
  locust_workers: 4