resources:
  instance_count: 1
  instance_type: ml.m5.xlarge
  volume_size: 200
pre_script:
  - set -e
  - base_dir="$(dirname "$0")"
  - cd $HOME
post_script:
  - echo "Copying dolphin_*.jsonl files"
  - for f in dolphin_*.jsonl; do aws s3 cp "$f" $S3_DATA_PATH/; done
train:
  env:
    - name: HOME
      value: $SM_OUTPUT_DATA_DIR
  command:
    - python3
  args:
    - $base_dir/preprocess_to_jsonl.py


